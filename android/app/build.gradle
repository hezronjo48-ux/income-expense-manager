plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv('KEYSTORE_PATH')
def keystorePassword = System.getenv('KEYSTORE_PASSWORD') ?: 'myledger2024!'
def keystoreAlias = System.getenv('KEYSTORE_ALIAS') ?: 'myledger'
def useKeystore = keystorePath != null && !keystorePath.isEmpty()

android {
    namespace 'tz.co.myledger.app'
    compileSdk 34

    defaultConfig {
        applicationId "tz.co.myledger.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        if (useKeystore) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystorePassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (useKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}