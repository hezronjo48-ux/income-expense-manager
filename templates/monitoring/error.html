<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ company_name }} - Error {{ code }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="login-page">
    <div class="login-container" style="max-width:500px;">
        <div class="login-card" style="text-align:center;padding:60px 40px;">
            <div class="login-icon-box" style="margin:0 auto 20px;width:80px;height:80px;font-size:2rem;background:var(--rose-bg);color:var(--rose);">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h1 style="font-size:3rem;font-weight:800;color:var(--g-800);margin-bottom:8px;">{{ code }}</h1>
            <p style="color:var(--gray-500);margin-bottom:32px;font-size:1.05rem;">{{ message }}</p>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary"><i class="fas fa-home"></i> Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
