{% extends "base.html" %}
{% block content %}

<div class="page-header">
    <h1><i class="fas fa-th-large" style="color:var(--primary);margin-right:10px;"></i>Dashboard</h1>
    <span class="date-display"><i class="far fa-calendar-alt" style="margin-right:6px;"></i>{{ now.strftime("%A, %B %d, %Y") }}</span>
</div>

<h2 class="section-title" style="margin-top:30px;margin-bottom:14px;font-size:1.15rem;"><i class="fas fa-piggy-bank" style="color:var(--primary);margin-right:8px;"></i> Total Income</h2>
<div class="cards-row">
    <div class="card card-income">
        <div class="card-label"><i class="fas fa-book" style="margin-right:4px;"></i> Main TZS Account Total Income</div>
        <div class="card-value">TZS {{ main_tzs_income|currency }}</div>
    </div>
    <div class="card" style="border-left:4px solid var(--info);">
        <div class="card-label"><i class="fas fa-dollar-sign" style="margin-right:4px;"></i> Dollar Account Total Income</div>
        <div class="card-value">$ {{ dollar_income_total|currency }}</div>
    </div>
</div>

<div class="chart-container">
    <h2><i class="fas fa-chart-line" style="color:var(--primary);margin-right:8px;"></i> Income vs Expenses (12 Months)</h2>
    <canvas id="dashboardChart" width="800" height="300"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
(function() {
    var ctx = document.getElementById('dashboardChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: {{ chart_labels|safe }},
            datasets: [
                {
                    label: 'Income',
                    data: {{ chart_income|safe }},
                    backgroundColor: 'rgba(14, 165, 233, 0.75)',
                    borderColor: 'rgba(3, 105, 161, 1)',
                    borderWidth: 2,
                    borderRadius: 4,
                    barPercentage: 0.6,
                },
                {
                    label: 'Expenses',
                    data: {{ chart_expense|safe }},
                    backgroundColor: 'rgba(255, 59, 48, 0.75)',
                    borderColor: 'rgba(217, 45, 35, 1)',
                    borderWidth: 2,
                    borderRadius: 4,
                    barPercentage: 0.6,
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        font: { size: 13, family: 'Inter' },
                        padding: 16,
                        usePointStyle: true,
                        pointStyle: 'circle'
                    }
                },
                tooltip: {
                    backgroundColor: 'rgba(17, 17, 17, 0.9)',
                    titleFont: { size: 13, family: 'Inter' },
                    bodyFont: { size: 13, family: 'Inter' },
                    padding: 12,
                    cornerRadius: 8,
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(0,0,0,0.04)' },
                    ticks: {
                        font: { size: 12, family: 'Inter' },
                        callback: function(value) { return '{{ currency_symbol }}' + value.toLocaleString(); }
                    }
                },
                x: {
                    grid: { display: false },
                    ticks: { font: { size: 12, family: 'Inter' } }
                }
            }
        }
    });
})();
</script>

{% endblock %}
