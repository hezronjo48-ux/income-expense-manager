<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>{{ company_name }} - Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#111111; color:#e2e8f0; min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .bg-ring { position:fixed; border-radius:50%; background:radial-gradient(circle,rgba(14,165,233,0.12) 0%,transparent 70%); }
        .bg-ring:nth-child(1) { width:600px;height:600px;top:-200px;left:-200px; }
        .bg-ring:nth-child(2) { width:500px;height:500px;bottom:-150px;right:-150px;background:radial-gradient(circle,rgba(14,165,233,0.08) 0%,transparent 70%); }
        .card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:48px 56px; max-width:520px; width:90%; text-align:center; backdrop-filter:blur(12px); }
        .icon { font-size:3rem; color:#0EA5E9; margin-bottom:20px; }
        h1 { font-size:1.6rem; font-weight:700; margin-bottom:8px; color:#f1f5f9; }
        p { color:#94a3b8; font-size:0.95rem; line-height:1.6; margin-bottom:24px; }
        .footer { color:#475569; font-size:0.8rem; }
    </style>
</head>
<body>
    <div class="bg-ring"></div>
    <div class="bg-ring"></div>
    <div class="card">
        <div class="icon"><i class="fas fa-tools"></i></div>
        <h1>{{ company_name }}</h1>
        <p>{{ message }}</p>
        <div class="footer"><i class="fas fa-clock"></i> Please check back later</div>
    </div>
</body>
</html>
